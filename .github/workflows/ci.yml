name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  checks:
    name: format + plugin + route
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      # RULE 2 — 提交前格式必须过
      - name: Markdown format (prettier)
        run: npx --yes prettier@3 --check "**/*.md"

      # JSON 必须可解析（route.json 曾因未转义引号在 main 上失效）
      - name: JSON syntax
        run: |
          fail=0
          while IFS= read -r f; do
            node -e "JSON.parse(require('fs').readFileSync(process.argv[1],'utf8'))" "$f" \
              || { echo "::error file=$f::invalid JSON"; fail=1; }
          done < <(git ls-files '*.json')
          exit $fail

      # route.json 单一来源：根目录必须与插件内唯一源一致
      - name: route.json single source
        run: node scripts/sync-route.mjs --check

      # RULE 7 主干保护 hook 的单元测试。
      #
      # 这份测试早就存在，但一直没接进 CI —— 也就是说 hook 改坏了不会有任何
      # 红灯。按 RULE 2「自动化测试覆盖足以支撑回归判断」，这是个真实的空洞：
      # 该 hook 会装到每个下游仓库、拦每一次 Bash/PowerShell 调用，误报会直接
      # 卡住所有人的工作流。挂上。
      - name: RULE 7 hook tests
        run: node plugins/openindu-control-tower/hooks/block-push-main.test.mjs

      # 插件 schema + skill/agent/hook 文件校验
      - name: Validate plugin
        run: npx --yes @anthropic-ai/claude-code@latest plugin validate ./plugins/openindu-control-tower --strict

      - name: Validate marketplace
        run: npx --yes @anthropic-ai/claude-code@latest plugin validate . --strict

      # 守则只能有一份源。发现第二份副本就 fail
      - name: Single principle source
        run: |
          copies=$(git ls-files | grep -iE '(^|/)principle\.md$' | grep -v '^team/principle\.md$' || true)
          if [ -n "$copies" ]; then
            echo "::error::发现守则副本，守则唯一源只能是 plugins/openindu-control-tower/skills/principle/SKILL.md"
            echo "$copies"
            exit 1
          fi
          echo "✓ 守则无重复副本"

      # route.json 必须覆盖组织下全部仓库。
      # 曾经漏了 4 个（plc4x / openindu-station / openplc-runtime / community），
      # 其中 plc4x 是组织内最大的代码体——靠人维护清单必然漂移，改由 CI 校验。
      #
      # 可见范围的坑（2026-08-25 实测）：默认 GITHUB_TOKEN 只对**本仓库**有权限，
      # `gh repo list openIndu` 因此只返回**公开**仓——当时是 5 个，而组织实际有 15 个。
      # 也就是说这道检查对全部 10 个私有仓（含所有业务仓）是失明的，绿灯并不代表
      # 全组织已覆盖。openIndu-vision / openIndu-cim 两个新建的私有仓就是这样漏过去的。
      #
      # 真正的修法是给一个有 org 读权限的 PAT（secret ORG_READ_TOKEN）。在那之前，
      # 至少让这道检查**说清楚自己看见了什么**，别让绿灯被误读成全覆盖。
      - name: route.json covers every org repo
        env:
          GH_TOKEN: ${{ secrets.ORG_READ_TOKEN || secrets.GITHUB_TOKEN }}
        run: |
          gh repo list openIndu --limit 100 --json name,visibility > /tmp/gh.json
          node -e "console.log(require('/tmp/gh.json').map(r=>r.name).join('\n'))" | sort -u > /tmp/gh.txt
          node -e "console.log(Object.keys(require('./route.json').repos).join('\n'))" | sort -u > /tmp/rj.txt
          priv=$(node -e "console.log(require('/tmp/gh.json').filter(r=>r.visibility!=='PUBLIC').length)")
          missing=$(comm -23 /tmp/gh.txt /tmp/rj.txt || true)
          if [ -n "$missing" ]; then
            echo "::error::以下仓库在 openIndu 组织下存在，但 route.json 未收录："
            echo "$missing" | sed 's/^/  - /'
            echo "请在 plugins/openindu-control-tower/reference/route.json 补录后运行 node scripts/sync-route.mjs"
            exit 1
          fi
          echo "✓ route.json 覆盖本 token 可见的 $(wc -l < /tmp/gh.txt) 个仓库（其中私有 $priv 个）"
          if [ "$priv" -eq 0 ]; then
            echo "::warning::本次只校验了公开仓——当前 token 看不到任何私有仓，私有仓的路由漂移不会被这道检查发现。配置 secret ORG_READ_TOKEN（需 org 读权限）以获得全覆盖。"
          fi

      # route.json 声明的 modules 必须与构建清单实际探测一致。
      # 曾经把 openindu-gateway 标成 rust，实际 main 上是 python（Rust 在未合并分支）。
      - name: route.json modules match detected build manifests
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/detect-modules.mjs --check

      # 席位一致性：文档声称的席位数 == agents/ 文件数；不得出现旧 agent 名
      # （backend/frontend/infra-deploy 作 agent 名已废止，stage-4 改名后多处文档曾残留）。
      - name: roster consistency (seat count + no stale agent names)
        run: node scripts/check-roster.mjs
